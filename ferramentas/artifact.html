<!-- Interface escolhida na engrenagem (⚙): Clássica (padrão) ou Zealot (tema Pedra Sombria do Daniel). -->
<script>
  (function () {
    var t = 'classica';
    var m = document.cookie.match(/(?:^|; )eldrin_interface=(\w+)/);   // cookie primeiro (no iPhone o localStorage às vezes
      if (m) t = m[1];                                                  // não grava a tempo antes de recarregar)
      else try { t = localStorage.getItem('eldrin.interface') || 'classica'; } catch (e) { /* sem armazenamento: Clássica */ }
    var tela = 'auto';   // casca do celular: ver jogar/index.html
    try { tela = localStorage.getItem('eldrin.tela') || 'auto'; } catch (e) { /* automática */ }
    var cel = tela === 'celular' || (tela === 'auto' && window.matchMedia && matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) <= 820);
    if (cel) { t = 'zealot'; document.documentElement.setAttribute('data-celular', ''); }
    document.documentElement.setAttribute('data-interface', t);
    if (t === 'zealot') document.write('<link rel="stylesheet" href="css/tema-sombrio-cores.css?v=122"><link rel="stylesheet" href="css/tema-sombrio.css?v=135">');
  })();
</script>
