<!-- Interface escolhida na engrenagem (⚙): Clássica (padrão) ou Zealot (tema Pedra Sombria do Daniel). -->
<script>
  (function () {
    var t = 'classica';
    try { t = localStorage.getItem('eldrin.interface') || 'classica'; } catch (e) { /* sem armazenamento: Clássica */ }
    document.documentElement.setAttribute('data-interface', t);
    if (t === 'zealot') document.write('<link rel="stylesheet" href="css/tema-sombrio-cores.css?v=120"><link rel="stylesheet" href="css/tema-sombrio.css?v=133">');
  })();
</script>
