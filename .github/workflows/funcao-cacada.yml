# Envia a função `cacada` (caçada decidida no servidor) para o Supabase sempre que o main mudar nas regras.
# Precisa do segredo SUPABASE_ACCESS_TOKEN no GitHub (Settings > Secrets and variables > Actions).
# Sem o segredo, só avisa e não falha.
name: Funcao cacada (Supabase)
on:
  push:
    branches: [main]
    paths:
      - 'js/dados.js'
      - 'js/historia.js'
      - 'js/regras.js'
      - 'js/servidor-cacada.js'
      - 'supabase/functions/**'
      - 'ferramentas/gerar_servidor.js'
      - '.github/workflows/funcao-cacada.yml'
  workflow_dispatch:
jobs:
  enviar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Empacotar as regras para o servidor
        run: node ferramentas/gerar_servidor.js
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Teste da função
        run: deno run --allow-read --allow-env testes/cacada_servidor.test.ts
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Enviar para o Supabase
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::Falta o segredo SUPABASE_ACCESS_TOKEN: função não enviada."; exit 0; fi
          supabase functions deploy cacada --project-ref cwlcdeqvwzpveduzhaol --no-verify-jwt --use-api --yes
