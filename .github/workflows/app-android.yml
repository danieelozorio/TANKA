# App Android do Eldrin (Capacitor, Henri, nov/2026). O jogo inteiro vai dentro do APK.
# A cada mudança do jogo no main: monta o pacote do jogo (eldrin-web.zip) e o versao.json no release "app-web";
# o app baixa o pacote novo em segundo plano e usa na próxima abertura (sem APK novo). webMinimo no versao.json
# (webMinimo: o maior entre o do release e o número em app-android/web-minimo.txt; 26/11/2026: 178 = troca do servidor para São Paulo, obriga a atualizar)
# (mudado à mão no release) obriga quem tem jogo mais velho a atualizar na hora, com a tela cheia.
# O APK é montado de novo só quando muda a parte do app (app-android/, js/app-nativo.js, este arquivo) ou no botão
# "Run workflow"; fica no release "app-android" (Eldrin-app.apk).
# Chave do APK: segredos ANDROID_CHAVE_B64 e ANDROID_CHAVE_SENHA (Settings > Secrets and variables > Actions).
# Sem eles, assina com a chave de TESTE (app-android/chave-teste.jks): serve para testar, não para os jogadores.
# Em outro branch (henri/apk-*): só monta o APK e deixa para baixar em "Artifacts" da execução (não mexe nos releases).
name: App Android
on:
  push:
    branches: [main, 'henri/apk-*']
    paths:
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'jogar/index.html'
      - 'app-android/**'
      - 'ferramentas/montar_app.js'
      - '.github/workflows/app-android.yml'
  workflow_dispatch:
concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  app:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      N: ${{ github.run_number }}
      REPO_URL: https://github.com/${{ github.repository }}/releases/download
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Precisa montar o APK?
        id: decide
        run: |
          APK=nao
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then APK=sim
          elif ! gh release view app-android >/dev/null 2>&1; then APK=sim
          elif ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > mudou.txt 2>/dev/null; then APK=sim
          elif grep -qE '^(app-android/|ferramentas/montar_app\.js|js/app-nativo\.js|\.github/workflows/app-android\.yml)' mudou.txt; then APK=sim
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Montar APK: $APK"

      - name: Firebase (notificações do servidor)
        id: firebase
        run: |
          # pushDesde = a versão do primeiro APK com o Firebase (app-android/google-services.json). O jogo só registra o
          # aparelho no Firebase com o APK dessa versão em diante (antes disso, registrar derrubaria o app).
          D=0
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            gh release download app-web -p versao.json -O antigo.json 2>/dev/null || echo '{}' > antigo.json
            D=$(node -e "console.log(require('./antigo.json').pushDesde||0)")
            if [ "$D" = "0" ] && [ -f app-android/google-services.json ] && [ "${{ steps.decide.outputs.apk }}" = "sim" ]; then D=$N; fi
          elif [ -f app-android/google-services.json ]; then D=1; fi
          echo "PUSH_DESDE=$D" >> "$GITHUB_ENV"; echo "pushDesde=$D"

      - name: Montar o jogo para o app
        run: |
          # No branch de teste o jogo do APK fica com versão 1, para o app oferecer a atualização do main e o teste apertar.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then ELDRIN_VERSAO_WEB=$N ELDRIN_PUSH_DESDE=$PUSH_DESDE node ferramentas/montar_app.js
          else ELDRIN_VERSAO_WEB=1 ELDRIN_PUSH_DESDE=$PUSH_DESDE ELDRIN_VERSOES_URL=$REPO_URL/app-teste/versao.json node ferramentas/montar_app.js; fi
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            node -e "const f='app-android/capacitor.config.json',c=require('./'+f);c.android.webContentsDebuggingEnabled=true;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          fi

      - uses: actions/setup-java@v5
        if: steps.decide.outputs.apk == 'sim'
        with: { distribution: temurin, java-version: 21 }

      - name: Montar o APK
        if: steps.decide.outputs.apk == 'sim'
        working-directory: app-android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          if [ -f google-services.json ]; then cp google-services.json android/app/; echo 'Firebase: ligado'; else echo 'Firebase: sem google-services.json (só notificações locais)'; fi
          # Ícones das notificações (Henri, 20/11/2026): espadas cruzadas (pequeno branco + grande colorido) e a cor vermelha.
          cp -r res/. android/app/src/main/res/
          sed -i '/<\/application>/i\        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_eldrin" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/eldrin_notificacao" />' android/app/src/main/AndroidManifest.xml
          grep -n 'default_notification' android/app/src/main/AndroidManifest.xml
          grep -rq adjustMarginsForEdgeToEdge node_modules/@capacitor/android/capacitor/src && echo 'margem da barra do celular: ok' || { echo '::error::Capacitor sem adjustMarginsForEdgeToEdge'; exit 1; }
          # Faixas da barra de notificações e da barra de baixo: pretas, com ícones claros.
          sed -i '/name="AppTheme.NoActionBar"/a\        <item name="android:windowBackground">@android:color/black</item>\n        <item name="android:windowLightStatusBar">false</item>\n        <item name="android:windowLightNavigationBar">false</item>' android/app/src/main/res/values/styles.xml
          cat android/app/src/main/res/values/styles.xml
          npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#01040f' --splashBackgroundColor '#010302' --splashBackgroundColorDark '#010302'
          sed -i -E "s/versionCode [0-9]+/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"1.0.$N\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
          npx cap sync android
          cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Assinar o APK
        if: steps.decide.outputs.apk == 'sim'
        env:
          CHAVE_B64: ${{ secrets.ANDROID_CHAVE_B64 }}
          CHAVE_SENHA: ${{ secrets.ANDROID_CHAVE_SENHA }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if [ -n "$CHAVE_B64" ] && [ -n "$CHAVE_SENHA" ]; then
            echo "$CHAVE_B64" | base64 -d > chave.jks; SENHA="$CHAVE_SENHA"; echo "Chave oficial."
          else
            cp app-android/chave-teste.jks chave.jks; SENHA=eldrin-teste
            echo "::warning::Sem os segredos ANDROID_CHAVE_B64/ANDROID_CHAVE_SENHA: APK assinado com a chave de TESTE."
          fi
          "$BT/zipalign" -f -p 4 app-android/android/app/build/outputs/apk/release/app-release-unsigned.apk alinhado.apk
          "$BT/apksigner" sign --ks chave.jks --ks-key-alias eldrin --ks-pass "pass:$SENHA" --key-pass "pass:$SENHA" --out Eldrin-app.apk alinhado.apk
          "$BT/apksigner" verify Eldrin-app.apk
          rm -f chave.jks
          ls -la Eldrin-app.apk

      - name: APK para baixar (branch de teste)
        if: steps.decide.outputs.apk == 'sim' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with: { name: Eldrin-app-apk, path: Eldrin-app.apk }

      - name: Publicar (releases app-android e app-web)
        if: github.ref == 'refs/heads/main'
        run: |
          gh release view app-web >/dev/null 2>&1 || gh release create app-web --title "App Android: pacote do jogo" --latest=false \
            --notes "Usado pelo app para se atualizar sozinho (eldrin-web.zip + versao.json). Não apagar."
          gh release download app-web -p versao.json -O antigo.json 2>/dev/null || echo '{}' > antigo.json
          APK_NUM=$(node -e "console.log(require('./antigo.json').apk||0)")
          if [ "${{ steps.decide.outputs.apk }}" = "sim" ]; then
            gh release view app-android >/dev/null 2>&1 || gh release create app-android --title "App Android do Eldrin (APK)" \
              --notes "Baixe o Eldrin-app.apk, toque no arquivo e permita instalar."
            gh release upload app-android Eldrin-app.apk --clobber
            APK_NUM=$N
          fi
          (cd app-android/www && zip -qr -9 ../../eldrin-web.zip .)
          MB=$(node -e "console.log((require('fs').statSync('eldrin-web.zip').size/1048576).toFixed(1))")
          SOMA=$(sha256sum eldrin-web.zip | cut -d' ' -f1)   # o app confere o arquivo baixado (o plugin exige)
          gh release upload app-web eldrin-web.zip --clobber
          node -e "require('fs').writeFileSync('versao.json', JSON.stringify({ web: $N, webUrl: '$REPO_URL/app-web/eldrin-web.zip', checksum: '$SOMA', tamanhoMB: $MB, apk: $APK_NUM, pushDesde: Number('$PUSH_DESDE') || 0, apkUrl: '$REPO_URL/app-android/Eldrin-app.apk', apkMinimo: 0, webMinimo: Math.max(Number(require('./antigo.json').webMinimo) || 0, Number((require('fs').existsSync('app-android/web-minimo.txt') ? require('fs').readFileSync('app-android/web-minimo.txt', 'utf8') : '0').trim()) || 0) }, null, 1))"
          cat versao.json
          gh release upload app-web versao.json --clobber

      # Teste num celular virtual (só nos branches de teste): instala o APK, abre e tira prints da tela.
      # Os prints ficam no release "app-teste" (pré-lançamento, só para conferir).
      - name: Liberar o celular virtual (KVM)
        if: steps.decide.outputs.apk == 'sim' && github.ref != 'refs/heads/main'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Preparar o teste (pacote de atualização de teste, versão 2)
        if: steps.decide.outputs.apk == 'sim' && github.ref != 'refs/heads/main'
        run: |
          pip install websocket-client
          ELDRIN_VERSAO_WEB=2 ELDRIN_PUSH_DESDE=$PUSH_DESDE ELDRIN_VERSOES_URL=$REPO_URL/app-teste/versao.json node ferramentas/montar_app.js
          (cd app-android/www && zip -qr -9 ../../eldrin-web.zip .)
          SOMA=$(sha256sum eldrin-web.zip | cut -d' ' -f1)
          node -e "require('fs').writeFileSync('versao.json', JSON.stringify({ web: 2, webUrl: '$REPO_URL/app-teste/eldrin-web.zip', checksum: '$SOMA', tamanhoMB: 43, apk: 0 }))"
          gh release view app-teste >/dev/null 2>&1 || gh release create app-teste --prerelease --latest=false --title "App Android: prints do teste" --notes "Teste do celular virtual."
          gh release upload app-teste eldrin-web.zip versao.json --clobber
      - name: Testar no celular virtual (Android 15)
        if: steps.decide.outputs.apk == 'sim' && github.ref != 'refs/heads/main'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: sh app-android/teste-celular.sh
      - name: Guardar os prints do teste
        if: always() && steps.decide.outputs.apk == 'sim' && github.ref != 'refs/heads/main'
        run: |
          gh release view app-teste >/dev/null 2>&1 || gh release create app-teste --prerelease --latest=false --title "App Android: prints do teste" --notes "Prints do celular virtual (branch de teste)."
          gh release upload app-teste tela-1.png tela-2.png tela-3.png logcat.txt teste.txt --clobber
